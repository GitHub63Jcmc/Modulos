<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 03 - HTML5 APIs Dashboard</title>
  
  <!-- Estilos globales del proyecto y específicos del módulo -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="css/modulo_03.css">

  <!-- Carga de componentes como módulos JS -->
  <script type="module" src="components/geo-weather.js"></script>
  <script type="module" src="components/task-board.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- Cabecera principal o componente unificado -->
  <mi-cabecera modulo="3" pagina="index.html"></mi-cabecera>

  <!-- Contenido principal -->
  <main class="dashboard-grid">
    <!-- Componente 1: Tiempo por geolocalización -->
    <section class="widget-card">
      <geo-weather></geo-weather>
    </section>

    <!-- Componente 2: Tablero de tareas -->
    <section class="widget-card">
      <task-board></task-board>
    </section>
  </main>

  <!-- COMPONENTE REUTILIZABLE DE PIE DE PÁGINA -->
  <mi-pie></mi-pie>

  <script src="../components/pie.js"></script>
  <script src="../components/cabecera.js"></script>

</body>
</html>
