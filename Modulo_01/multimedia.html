<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia - Módulo 1 HTML5</title>
  <!-- 1. Estilos Globales Compartidos -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="styles/estilos_01.css">
</head>
<body>

  <!-- COMPONENTE REUTILIZABLE DE CABECERA -->
  <mi-cabecera modulo="1" pagina="multimedia.html"></mi-cabecera>

  <main class="contenedor-principal">

    <section class="tarjeta-contenido">
      <h2>1.4 Recursos Multimedia Nativos</h2>

      <!-- Selector y Reproductor de Vídeo -->
      <div class="media-container">
        <h3>Reproductor de Vídeo</h3>
        
        <div class="selector-archivo">
          <label for="selectVideo">Cargar vídeo local (MP4, WebM):</label>
          <input type="file" id="selectVideo" accept="video/*">
        </div>

        <video id="reproductorVideo" controls poster="img/01_Esquema.jpg" width="100%">
          <source src="video/video-ejemplo.mp4" type="video/mp4">
          Tu navegador no soporta el elemento de vídeo nativo.
        </video>
      </div>

      <!-- Selector y Reproductor de Audio -->
      <div class="media-container" style="margin-top: 2rem;">
        <h3>Reproductor de Audio</h3>
        
        <div class="selector-archivo">
          <label for="selectAudio">Cargar audio local (MP3, WAV, OGG):</label>
          <input type="file" id="selectAudio" accept="audio/*">
        </div>

        <audio id="reproductorAudio" controls preload="metadata" style="width: 100%;">
          <source src="audio/audio-ejemplo.mp3" type="audio/mpeg">
          Tu navegador no soporta el elemento de audio nativo.
        </audio>
      </div>
    </section>

    <aside class="barra-lateral">
      <h3>Carga Dinámica</h3>
      <p>Utilizamos las APIs de HTML5 para leer archivos locales mediante un <strong>Blob URL</strong> sin necesidad de subirlos a ningún servidor.</p>
    </aside>

  </main>

  <footer class="pie-pagina">
    <p>&copy; jcmc - 2026 Módulo 1 - HTML5 y CSS3. Todos los derechos reservados.</p>
  </footer>

  <!-- Script para la carga dinámica de archivos -->
  <script src="js/media-selector.js"></script>

  <!-- Carga del script del componente -->
  <script src="../components/cabecera.js"></script>

</body>
</html>
