<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario - Módulo 1 HTML5</title>
  <!-- 1. Estilos Globales Compartidos -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="styles/estilos_01.css">
</head>
<body>

  <!-- COMPONENTE REUTILIZABLE DE CABECERA -->
  <mi-cabecera modulo="1" pagina="formulario.html"></mi-cabecera>

  <main class="contenedor-principal">

    <section class="tarjeta-contenido">
      <h2>1.5 Formulario de Registro con Tipos Avanzados de HTML5</h2>
      
      <form action="#" method="POST" class="formulario-html5">
        
        <div class="campo-grupo">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
        </div>

        <div class="campo-grupo">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
        </div>

        <div class="campo-grupo">
          <label for="fecha">Fecha de inicio (Input Date):</label>
          <input type="date" id="fecha" name="fecha_inicio" required>
        </div>

        <div class="campo-grupo">
          <label for="experiencia">Años de experiencia (Input Number):</label>
          <input type="number" id="experiencia" name="experiencia" min="0" max="50" value="1">
        </div>

        <button type="submit">Enviar Formulario</button>
      </form>
    </section>

    <aside class="barra-lateral">
      <h3>Validación Nativa</h3>
      <p>HTML5 permite validar campos mediante atributos como <code>required</code>, <code>min</code>, <code>max</code> sin necesidad de JavaScript.</p>
    </aside>

  </main>

  <!-- COMPONENTE REUTILIZABLE DE PIE DE PÁGINA -->
  <mi-pie></mi-pie>

  <script src="../components/pie.js"></script>
  <script src="../components/cabecera.js"></script> <!-- Carga del script del componente -->
</body>
</html>
